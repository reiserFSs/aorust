[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
ao-scene = { path = "crates/ao-scene" }
ao-rdb = { path = "crates/ao-rdb" }
ao-formats = { path = "crates/ao-formats" }
ao-render = { path = "crates/ao-render" }
ao-gui = { path = "crates/ao-gui" }
ao-install = { path = "crates/ao-install" }
ao-net = { path = "crates/ao-net" }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

# Keep target/ small: no incremental cache, line tables only for debug builds.
[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.test]
incremental = false
debug = "line-tables-only"
